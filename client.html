<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blockhide — online</title>
<style>
  :root{
    --bg:#0a0d13;
    --panel:#151b26;
    --panel2:#1c2433;
    --line:#2a3446;
    --accent:#5ac8ff;
    --text:#e8edf7;
    --muted:#8b98ad;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    user-select:none;-webkit-user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;}
  #ui{position:fixed;inset:0;pointer-events:none;}
  .hidden{display:none !important;}

  .btn{
    pointer-events:auto;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#222c3d,#1a2230);
    color:var(--text);
    padding:10px 18px;border-radius:10px;
    font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:transform .12s, background .15s, border-color .15s, filter .15s;
  }
  .btn:hover{background:linear-gradient(180deg,#2b374b,#202a3a);border-color:#3a4761;transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{
    background:linear-gradient(180deg,#3fb4f0,#1f7fc4);
    border-color:#5ac8ff;color:#04121c;
    box-shadow:0 6px 26px rgba(90,200,255,.28);
  }
  .btn.primary:hover{filter:brightness(1.12);}
  .btn.ghost{background:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.05);}
  .btn.small{padding:7px 14px;font-size:13px;}
  .btn.big{padding:18px 58px;font-size:20px;letter-spacing:.08em;text-transform:uppercase;border-radius:14px;}

  .screen{position:absolute;inset:0;pointer-events:none;}

  #screenMenu .logo{
    position:absolute;left:52px;top:44px;
    font-size:66px;font-weight:900;letter-spacing:-.04em;line-height:1;
    text-shadow:0 8px 40px rgba(90,200,255,.18);
  }
  #screenMenu .logo span{color:var(--accent);}
  #screenMenu .tagline{
    position:absolute;left:56px;top:124px;
    font-size:15px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;
  }
  #screenMenu .name-box{
    position:absolute;left:56px;top:190px;
    pointer-events:auto;
    display:flex;gap:8px;align-items:center;
  }
  #screenMenu .name-box input{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-size:14px;font-family:inherit;outline:none;
    width:220px;
  }
  #screenMenu .name-box input:focus{border-color:var(--accent);}
  #btnPlay{position:absolute;right:44px;bottom:44px;}

  #screenList{display:flex;align-items:center;justify-content:center;background:rgba(6,9,15,.55);backdrop-filter:blur(4px);pointer-events:auto;}
  .panel{
    pointer-events:auto;
    width:min(560px,92vw);
    background:linear-gradient(180deg,#151b26,#10151e);
    border:1px solid var(--line);border-radius:18px;
    padding:26px 26px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .panel h2{margin:0 0 18px;font-size:22px;letter-spacing:-.01em;}
  .row{display:flex;gap:10px;margin-top:18px;}
  .row .btn{flex:1;}
  .lobby-list{display:flex;flex-direction:column;gap:9px;max-height:44vh;overflow:auto;}
  .lobby-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;
  }
  .lobby-item .nm{font-weight:600;font-size:15px;}
  .lobby-item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:22px 0;}

  .hud{position:absolute;inset:0;pointer-events:none;}
  .hud-top{
    position:absolute;left:22px;top:20px;right:22px;
    display:flex;align-items:flex-start;justify-content:space-between;
  }
  .hud-card{
    background:rgba(16,21,30,.82);border:1px solid var(--line);
    border-radius:13px;padding:11px 16px;backdrop-filter:blur(6px);
  }
  .hud-title{font-size:16px;font-weight:700;}
  .hud-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .role{font-size:15px;font-weight:800;letter-spacing:.05em;}
  .role.hunter{color:#ff7b72;}
  .role.hider{color:#5ac8ff;}
  .hint{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(16,21,30,.82);border:1px solid var(--line);
    border-radius:11px;padding:9px 20px;font-size:13.5px;color:var(--muted);
    backdrop-filter:blur(6px);white-space:nowrap;
  }
  .players-list{
    margin-top:10px;display:flex;flex-direction:column;gap:4px;
  }
  .players-list .pl{
    font-size:12.5px;color:var(--muted);
  }
  .players-list .pl.host{color:var(--accent);}

  .modal{
    position:absolute;inset:0;pointer-events:auto;
    background:rgba(5,8,14,.74);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-box{
    width:min(520px,92vw);max-height:88vh;overflow:auto;
    background:linear-gradient(180deg,#161d29,#10151e);
    border:1px solid var(--line);border-radius:18px;
    padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.7);
  }
  .modal-box h2{margin:0 0 18px;font-size:20px;}
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;letter-spacing:.03em;}
  .field select,.field input[type=range]{width:100%;}
  .field select{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
  }
  .field select:focus{border-color:var(--accent);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:6px;border-radius:4px;
    background:#26303f;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 12px rgba(90,200,255,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer;
  }
  .check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text);cursor:pointer;}
  .check input{width:16px;height:16px;accent-color:#5ac8ff;cursor:pointer;}
  .muted{color:var(--muted);font-size:13px;}
  .status{font-size:12.5px;color:var(--muted);margin-top:8px;}
  .status.ok{color:#7ee787;}
  .status.err{color:#ff7b72;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">

  <div class="screen" id="screenMenu">
    <div class="logo">block<span>hide</span></div>
    <div class="tagline">2.5D онлайн-прятки в мире блоков</div>
    <div class="name-box">
      <input id="inpName" maxlength="20" placeholder="Ваше имя" value="Игрок">
    </div>
    <button class="btn primary big" id="btnPlay">Играть</button>
    <div class="status" id="connStatus" style="position:absolute;left:56px;top:250px;"></div>
  </div>

  <div class="screen hidden" id="screenList">
    <div class="panel">
      <h2>Лобби</h2>
      <div class="lobby-list" id="lobbyItems"></div>
      <div class="row">
        <button class="btn primary" id="btnCreateLobby">Создать лобби</button>
        <button class="btn ghost" id="btnBackMenu">Назад</button>
      </div>
    </div>
  </div>

  <div class="hud hidden" id="hudLobby">
    <div class="hud-top">
      <div class="hud-card">
        <div class="hud-title" id="lobbyName">Лобби</div>
        <div class="hud-sub" id="lobbyInfo">1/4 игроков</div>
        <div class="players-list" id="playersList"></div>
      </div>
      <button class="btn ghost small" id="btnLeaveLobby">Выйти</button>
    </div>
    <div class="hint" id="lobbyHint">WASD — ходить · подойди к терминалу и нажми E</div>
  </div>

  <div class="hud hidden" id="hudGame">
    <div class="hud-top">
      <div class="hud-card">
        <div class="role hider" id="gameRole">ВЫ — ПРЯЧУЩИЙСЯ</div>
        <div class="hud-sub" id="gameTimer">00:00</div>
        <div class="hud-sub" id="gameInfo">Прячущихся: 0</div>
      </div>
      <button class="btn ghost small" id="btnGameMenu">В лобби</button>
    </div>
    <div class="hint" id="gameHint">Подойди к блоку и нажми E</div>
  </div>

  <div class="modal hidden" id="panelSettings">
    <div class="modal-box">
      <h2>Настройки лобби</h2>

      <div class="field">
        <label>Карта</label>
        <select id="selMap">
          <option value="test1">Тест 1 — склад с коробками</option>
          <option value="random">Случайная</option>
        </select>
      </div>

      <div class="field">
        <label>Охотник</label>
        <select id="selHunter"></select>
      </div>

      <div class="field">
        <label>Количество игроков: <span id="lblCount">4</span></label>
        <input type="range" id="rngCount" min="1" max="4" step="1" value="4">
      </div>

      <div class="field">
        <label class="check"><input type="checkbox" id="chkBots" checked> Прячущиеся боты</label>
      </div>

      <div class="field">
        <label class="check"><input type="checkbox" id="chkDebug"> Отладочное меню для хоста (F12 / ~)</label>
      </div>

      <div class="row">
        <button class="btn primary" id="btnStartGame">Играть</button>
        <button class="btn ghost" id="btnCloseSettings">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="panelDebug">
    <div class="modal-box">
      <h2>Отладка</h2>
      <div class="field">
        <label>Роль</label>
        <button class="btn" id="btnSwitchRole" style="width:100%">Стать охотником</button>
      </div>
      <div class="field">
        <button class="btn" id="btnExitToMenu" style="width:100%">Выйти в меню</button>
      </div>
      <div class="field muted">Здесь позже появятся другие инструменты.</div>
      <div class="row">
        <button class="btn ghost" id="btnCloseDebug">Закрыть</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   blockhide — client (online)
   ========================================================= */
(function(){
'use strict';

const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

function roundRect(x,y,w,h,r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------------- canvas ---------------- */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- projection ---------------- */
const ISO_X = 0.866, ISO_Y = 0.5;
const cam = { x:0, y:0, zoom:1 };

function project(wx, wy, wz){
  const dx = wx - cam.x, dy = wy - cam.y;
  return {
    x: W*0.5 + (dx - dy) * ISO_X * cam.zoom,
    y: H*0.5 + (dx + dy) * ISO_Y * cam.zoom - (wz || 0) * cam.zoom
  };
}
function screenToWorld(sx, sy){
  const A = (sx - W*0.5) / (ISO_X * cam.zoom);
  const B = (sy - H*0.5) / (ISO_Y * cam.zoom);
  const dx = (A + B) * 0.5;
  const dy = (B - A) * 0.5;
  return { x: cam.x + dx, y: cam.y + dy };
}

/* ---------------- palette ---------------- */
const BLOCK_COLORS = [
  { top:'#e2695f', side1:'#b34c44', side2:'#8f3b34' },
  { top:'#5f8fe2', side1:'#4470b3', side2:'#34568f' },
  { top:'#6ec06a', side1:'#4f9a4c', side2:'#3d7a3a' },
  { top:'#e8c95a', side1:'#c0a340', side2:'#9a8232' },
  { top:'#a97de0', side1:'#8660b8', side2:'#684a90' },
  { top:'#5fc7c7', side1:'#459f9f', side2:'#337b7b' },
];
function colorByTop(top){
  return BLOCK_COLORS.find(c => c.top === top) || BLOCK_COLORS[0];
}

/* ---------------- state ---------------- */
const state = {
  screen: 'menu',
  ws: null,
  connected: false,
  youId: null,
  name: 'Игрок',
  lobbies: [],
  lobby: null,
  isHost: false,
  game: null,
  serverState: null,
  debugEnabled: false,
  localDisguised: false,
  localDisguiseColor: null,
  nearCrate: null,
  settingsOpen: false,
};

/* ---------------- input ---------------- */
const keys = Object.create(null);
const mouse = { x: 0, y: 0, down: false };

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mouse.down = true;
  if (isModalOpen()) return;
  if (state.screen === 'game') shoot();
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

window.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  keys[e.code] = true;

  if (e.code === 'F12' || e.code === 'Backquote'){
    if (state.screen === 'game' && state.debugEnabled){
      e.preventDefault();
      toggleDebug();
    }
    return;
  }
  if (e.code === 'KeyE' && !e.repeat && !isModalOpen()){
    tryInteract();
  }
  if (e.code === 'Escape'){
    if (isModalOpen('#panelDebug')) closeDebug();
    else if (isModalOpen('#panelSettings')) closeSettings();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

function isModalOpen(sel){
  if (sel) return !$(sel).classList.contains('hidden');
  return document.querySelectorAll('.modal:not(.hidden)').length > 0;
}
function getInput(){
  let ix = 0, iy = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
  const len = Math.hypot(ix, iy);
  if (len > 0){ ix /= len; iy /= len; }
  return { ix, iy };
}

/* ---------------- WebSocket ---------------- */
function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  state.ws = ws;

  ws.onopen = () => {
    state.connected = true;
    setConnStatus('Подключено', 'ok');
    send({ type: 'setName', name: state.name });
  };
  ws.onclose = () => {
    state.connected = false;
    setConnStatus('Отключено — перезагрузите страницу', 'err');
  };
  ws.onerror = () => setConnStatus('Ошибка соединения', 'err');

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  };
}

function send(msg){
  if (state.ws && state.ws.readyState === 1) {
    state.ws.send(JSON.stringify(msg));
  }
}

function setConnStatus(text, cls){
  const el = $('#connStatus');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

function handleMessage(msg){
  switch (msg.type){
    case 'welcome':
      state.youId = msg.id;
      break;

    case 'lobbyList':
      state.lobbies = msg.lobbies || [];
      if (state.screen === 'list') renderLobbyList();
      break;

    case 'lobbyJoined':
      state.lobby = msg.lobby;
      state.isHost = msg.lobby.hostId === state.youId;
      enterLobbyScreen();
      break;

    case 'lobbyUpdate':
      state.lobby = msg.lobby;
      state.isHost = msg.lobby.hostId === state.youId;
      if (state.screen === 'lobby') updateLobbyHud();
      break;

    case 'lobbyLeft':
      state.lobby = null;
      state.isHost = false;
      setScreen('list');
      break;

    case 'error':
      console.warn('server error:', msg.text);
      break;

    case 'gameStart':
      handleGameStart(msg);
      break;

    case 'state':
      handleState(msg);
      break;

    case 'backToLobby':
      state.game = null;
      state.serverState = null;
      if (msg.lobby){
        state.lobby = msg.lobby;
        state.isHost = msg.lobby.hostId === state.youId;
      }
      buildLobbyWorld();
      setScreen('lobby');
      updateLobbyHud();
      break;
  }
}

/* =========================================================
   SCREENS
   ========================================================= */
function setScreen(s){
  state.screen = s;
  $('#screenMenu').classList.toggle('hidden', s !== 'menu');
  $('#screenList').classList.toggle('hidden', s !== 'list');
  $('#hudLobby').classList.toggle('hidden', s !== 'lobby');
  $('#hudGame').classList.toggle('hidden', s !== 'game');
  if (s !== 'lobby') closeSettings();
  if (s !== 'game') closeDebug();
  canvas.style.cursor = 'default';
}

function renderLobbyList(){
  const wrap = $('#lobbyItems');
  wrap.innerHTML = '';
  if (!state.lobbies.length){
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Пока нет лобби. Создай своё!';
    wrap.appendChild(d);
    return;
  }
  state.lobbies.forEach(lobby => {
    const item = document.createElement('div');
    item.className = 'lobby-item';

    const left = document.createElement('div');
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = lobby.name;
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = `${lobby.players.length}/${lobby.settings.playerCount} · боты: ${lobby.settings.bots ? 'вкл' : 'выкл'} · ${lobby.state === 'game' ? 'в игре' : 'ожидание'}`;
    left.appendChild(nm); left.appendChild(sub);

    const btn = document.createElement('button');
    btn.className = 'btn primary small';
    btn.textContent = lobby.state === 'game' ? 'Занято' : 'Войти';
    btn.disabled = lobby.state === 'game';
    btn.onclick = () => send({ type: 'joinLobby', lobbyId: lobby.id });

    item.appendChild(left);
    item.appendChild(btn);
    wrap.appendChild(item);
  });
}

function updateLobbyHud(){
  const l = state.lobby;
  if (!l) return;
  $('#lobbyName').textContent = l.name;
  $('#lobbyInfo').textContent = `${l.players.length}/${l.settings.playerCount} игроков · боты: ${l.settings.bots ? 'вкл' : 'выкл'} · ${state.isHost ? 'вы хост' : 'гость'}`;
  const pl = $('#playersList');
  pl.innerHTML = '';
  l.players.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pl' + (p.id === l.hostId ? ' host' : '');
    d.textContent = p.name + (p.id === state.youId ? ' (вы)' : '') + (p.id === l.hostId ? ' — хост' : '');
    pl.appendChild(d);
  });
  $('#lobbyHint').textContent = state.isHost
    ? 'WASD — ходить · подойди к терминалу и нажми E, чтобы настроить лобби'
    : 'WASD — ходить · хост настраивает лобби у терминала';
}

function enterLobbyScreen(){
  buildLobbyWorld();
  setScreen('lobby');
  updateLobbyHud();
}

/* =========================================================
   LOBBY WORLD (клиентский, только для прогулки)
   ========================================================= */
let lobbyWorld = null;

function buildLobbyWorld(){
  const rw = 900, rh = 700;
  lobbyWorld = {
    room: { w: rw, h: rh },
    player: { x: rw/2, y: rh*0.78, r: 13, speed: 230, phase: 0, moving: false },
    bounds: { x0: 70, y0: 70, x1: rw - 70, y1: rh - 70 },
    terminal: { x: rw/2, y: rh*0.30, hw: 36, hd: 36, h: 56 },
    walls: [
      { x: rw/2, y: -22, hw: rw/2, hd: 22, h: 110, top:'#242c3d', side1:'#1a2130', side2:'#131a26' },
      { x: -22, y: rh/2, hw: 22, hd: rh/2, h: 110, top:'#242c3d', side1:'#1a2130', side2:'#131a26' },
    ],
    colliders: [],
  };
  lobbyWorld.colliders.push({ x: lobbyWorld.terminal.x, y: lobbyWorld.terminal.y, hw: 38, hd: 38 });
  cam.zoom = 0.9;
  cam.x = lobbyWorld.player.x;
  cam.y = lobbyWorld.player.y;
}

function updateLobby(dt){
  const w = lobbyWorld;
  if (!w) return;
  const p = w.player;
  const { ix, iy } = getInput();
  const moving = ix !== 0 || iy !== 0;
  p.moving = moving;
  if (moving){
    const inv = Math.SQRT1_2;
    p.x += (ix + iy) * inv * p.speed * dt;
    p.y += (-ix + iy) * inv * p.speed * dt;
    p.phase += dt * 12;
  }
  collideCircleBoxes(p, w.colliders);
  p.x = clamp(p.x, w.bounds.x0, w.bounds.x1);
  p.y = clamp(p.y, w.bounds.y0, w.bounds.y1);
  cam.x += (p.x - cam.x) * Math.min(1, dt * 8);
  cam.y += (p.y - cam.y) * Math.min(1, dt * 8);
}

function collideCircleBoxes(p, boxes){
  for (let i=0;i<boxes.length;i++){
    const b = boxes[i];
    const cx = clamp(p.x, b.x - b.hw, b.x + b.hw);
    const cy = clamp(p.y, b.y - b.hd, b.y + b.hd);
    const dx = p.x - cx, dy = p.y - cy;
    const d2 = dx*dx + dy*dy;
    if (d2 < p.r*p.r){
      if (d2 < 1e-8){
        const left  = p.x - (b.x - b.hw);
        const right = (b.x + b.hw) - p.x;
        const top   = p.y - (b.y - b.hd);
        const bot   = (b.y + b.hd) - p.y;
        const m = Math.min(left, right, top, bot);
        if (m === left)       p.x = b.x - b.hw - p.r;
        else if (m === right) p.x = b.x + b.hw + p.r;
        else if (m === top)   p.y = b.y - b.hd - p.r;
        else                  p.y = b.y + b.hd + p.r;
      } else {
        const d = Math.sqrt(d2);
        p.x += dx/d * (p.r - d);
        p.y += dy/d * (p.r - d);
      }
    }
  }
}

function renderLobby(){
  const w = lobbyWorld;
  if (!w) return;
  drawFloor(0, 0, w.room.w, w.room.h, '#151c29', 'rgba(255,255,255,0.045)', 60);
  w.walls.forEach(wall => drawCrate(wall));

  const t = w.terminal;
  const items = [];
  items.push({ d: t.x + t.y, fn: () => drawTerminal(t) });
  items.push({ d: w.player.x + w.player.y, fn: () => drawHumanoid(w.player.x, w.player.y, '#eef2f9', w.player.phase) });
  items.sort((a,b) => a.d - b.d);
  items.forEach(i => i.fn());

  const dist = Math.hypot(w.player.x - t.x, w.player.y - t.y);
  if (dist < 140){
    const pr = project(t.x, t.y, t.h + 40);
    drawFloatLabel(pr.x, pr.y, 'E');
  }
}

function drawTerminal(t){
  drawCrate({ x:t.x, y:t.y, hw:t.hw, hd:t.hd, h:t.h,
              top:'#3d7ea8', side1:'#2b5c7d', side2:'#1f455e' });
  const p = project(t.x, t.y, t.h);
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 70 * cam.zoom);
  g.addColorStop(0, 'rgba(90,200,255,0.40)');
  g.addColorStop(1, 'rgba(90,200,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, 70 * cam.zoom, 0, TAU); ctx.fill();
}

/* =========================================================
   GAME
   ========================================================= */
function handleGameStart(msg){
  state.game = {
    R: msg.game.R,
    crates: msg.game.crates,
    seed: msg.game.seed,
    entities: msg.game.entities,
    projectiles: [],
    effects: [],
    toasts: [],
    time: 0,
    over: false,
    overTime: 0,
  };
  state.youId = msg.youId;
  state.localDisguised = false;
  state.localDisguiseColor = null;
  state.nearCrate = null;

  // локальный персонаж = сущность с нашим id
  const me = state.game.entities.find(e => e.id === state.youId);
  if (me){
    cam.x = me.x; cam.y = me.y;
  }
  cam.zoom = 1.25;

  closeSettings();
  setScreen('game');
  updateGameHud();
}

function handleState(msg){
  if (!state.game) return;
  const g = state.game;
  g.entities = msg.entities || [];
  g.projectiles = msg.projectiles || [];
  g.effects = msg.effects || [];
  g.toasts = msg.toasts || [];
  g.time = msg.time || 0;
  g.over = !!msg.over;
  g.overTime = msg.overTime || 0;
  updateGameHud();
}

function localEntity(){
  if (!state.game) return null;
  return state.game.entities.find(e => e.id === state.youId);
}

function sendInput(){
  const me = localEntity();
  if (!me || !state.game || state.game.over) return;
  send({
    type: 'input',
    x: me.x, y: me.y,
    fx: me.fx, fy: me.fy,
    disguised: state.localDisguised,
    disguiseColor: state.localDisguiseColor,
  });
}

function updateGameClient(dt){
  const g = state.game;
  if (!g) return;
  const me = localEntity();
  if (!me) return;

  if (!g.over){
    const { ix, iy } = getInput();
    const moving = ix !== 0 || iy !== 0;
    if (moving){
      const inv = Math.SQRT1_2;
      const sp = 190 * (state.localDisguised ? 0.72 : 1);
      me.x += (ix + iy) * inv * sp * dt;
      me.y += (-ix + iy) * inv * sp * dt;
      me.fx = (ix + iy) * inv;
      me.fy = (-ix + iy) * inv;
      sendInput();
    }

    if (me.role === 'hunter' && mouse.down) shoot();
  }

  cam.x += (me.x - cam.x) * Math.min(1, dt * 8);
  cam.y += (me.y - cam.y) * Math.min(1, dt * 8);

  // ближайший блок для прячущегося
  if (me.role === 'hider' && !state.localDisguised){
    state.nearCrate = findNearCrate(g, me.x, me.y, 80);
  } else {
    state.nearCrate = null;
  }
}

function findNearCrate(g, x, y, baseReach){
  let best = null, bd = 1e9;
  for (const c of g.crates){
    const d = Math.hypot(c.x - x, c.y - y);
    const reach = Math.max(c.hw, c.hd) + baseReach;
    if (d < reach && d < bd){ bd = d; best = c; }
  }
  return best;
}

function shoot(){
  const me = localEntity();
  if (!me || !state.game || state.game.over) return;
  if (me.role !== 'hunter') return;
  if (me.shootCd > 0) return;

  const target = screenToWorld(mouse.x, mouse.y);
  let dx = target.x - me.x, dy = target.y - me.y;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  send({ type: 'shoot', dx, dy });
  me.shootCd = 0.3; // локальный кулдаун
}

function tryInteract(){
  if (isModalOpen()) return;

  if (state.screen === 'lobby' && lobbyWorld){
    const t = lobbyWorld.terminal;
    const d = Math.hypot(lobbyWorld.player.x - t.x, lobbyWorld.player.y - t.y);
    if (d < 140 && state.isHost) openSettings();
    return;
  }

  if (state.screen === 'game' && state.game){
    const me = localEntity();
    if (!me || me.role !== 'hider') return;

    if (state.localDisguised){
      state.localDisguised = false;
      state.localDisguiseColor = null;
      sendInput();
      updateGameHud();
    } else {
      const c = findNearCrate(state.game, me.x, me.y, 80);
      if (c){
        state.localDisguised = true;
        state.localDisguiseColor = c.top;
        sendInput();
        updateGameHud();
      }
    }
  }
}

/* ---------- HUD ---------- */
function updateGameHud(){
  if (!state.game) return;
  const me = localEntity();
  if (!me) return;

  const roleEl = $('#gameRole');
  if (me.role === 'hunter'){
    roleEl.textContent = 'ВЫ — ОХОТНИК';
    roleEl.className = 'role hunter';
    $('#gameHint').textContent = 'ЛКМ — выстрелить водой · WASD — ходить';
    canvas.style.cursor = 'crosshair';
  } else {
    roleEl.textContent = state.localDisguised ? 'ВЫ — ПРЯЧУЩИЙСЯ (замаскирован)' : 'ВЫ — ПРЯЧУЩИЙСЯ';
    roleEl.className = 'role hider';
    if (state.localDisguised){
      $('#gameHint').textContent = 'E — снять маскировку · WASD — ходить (медленнее)';
    } else if (state.nearCrate){
      $('#gameHint').textContent = 'E — замаскироваться под этот блок';
    } else {
      $('#gameHint').textContent = 'Подойди к блоку и нажми E';
    }
    canvas.style.cursor = 'default';
  }

  const hiders = state.game.entities.filter(e => e.role === 'hider').length;
  $('#gameInfo').textContent = 'Прячущихся: ' + hiders;

  const t = Math.floor(state.game.time);
  $('#gameTimer').textContent =
    String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

/* ---------- рендер игры ---------- */
function drawEntity(e){
  if (e.role === 'hider' && e.disguised && e.disguiseColor){
    const col = colorByTop(e.disguiseColor);
    drawCrate({
      x: e.x, y: e.y, hw: 20, hd: 20, h: 42,
      top: col.top, side1: col.side1, side2: col.side2
    });
  } else {
    drawHumanoid(e.x, e.y, '#eef2f9', performance.now() / 80, {
      gun: e.role === 'hunter',
      flash: e.shootFlash
    });
  }

  if (e.id === state.youId){
    const b = project(e.x, e.y, 0);
    const z = cam.zoom;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = e.role === 'hunter' ? '#ff9d94' : '#7fe3ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6 * z, 5 * z]);
    ctx.lineDashOffset = -performance.now() * 0.012;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, 17 * z, 8.5 * z, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function renderGame(){
  const g = state.game;
  if (!g) return;

  drawFloor(-g.R, -g.R, g.R, g.R, '#121a26', 'rgba(255,255,255,0.045)', 25);
  drawCrate({ x: 0, y: -g.R - 16, hw: g.R, hd: 16, h: 120, top:'#1e2637', side1:'#161d2b', side2:'#101623' });
  drawCrate({ x: -g.R - 16, y: 0, hw: 16, hd: g.R, h: 120, top:'#1e2637', side1:'#161d2b', side2:'#101623' });

  const items = [];
  for (const c of g.crates){
    const isNear = (c === state.nearCrate);
    items.push({ d: c.x + c.y, fn: () => drawCrate(c, isNear ? {highlight: 0.7, glow: '#7fe3ff'} : null) });
  }
  for (const e of g.entities){
    // для локального игрока используем его локальное состояние маскировки
    if (e.id === state.youId){
      const copy = { ...e, disguised: state.localDisguised, disguiseColor: state.localDisguiseColor };
      items.push({ d: copy.x + copy.y, fn: () => drawEntity(copy) });
    } else {
      items.push({ d: e.x + e.y, fn: () => drawEntity(e) });
    }
  }
  for (const p of g.projectiles) items.push({ d: p.x + p.y, fn: () => drawProjectile(p) });
  items.sort((a, b) => a.d - b.d);
  items.forEach(i => i.fn());

  for (const f of g.effects) drawSplash(f);

  if (state.nearCrate && localEntity() && localEntity().role === 'hider' && !state.localDisguised){
    const pr = project(state.nearCrate.x, state.nearCrate.y, state.nearCrate.h + 30);
    drawFloatLabel(pr.x, pr.y, 'E');
  }

  for (const t of g.toasts){
    const pr = project(t.x, t.y, t.z);
    ctx.save();
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = t.color || '#ffd166';
    ctx.fillText(t.text, pr.x, pr.y);
    ctx.restore();
  }

  if (g.over){
    const a = Math.min(1, g.overTime * 2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,12,18,0.62)';
    ctx.fillRect(0, H * 0.36, W, 120);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166';
    ctx.font = '900 46px Segoe UI, system-ui, sans-serif';
    ctx.fillText('Все найдены!', W / 2, H * 0.36 + 58);
    ctx.fillStyle = '#9fb0c9';
    ctx.font = '600 18px Segoe UI, system-ui, sans-serif';
    ctx.fillText('Охотники победили · вернитесь в лобби', W / 2, H * 0.36 + 92);
    ctx.restore();
  }
}

/* =========================================================
   DRAWING PRIMITIVES
   ========================================================= */
function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}

function drawFloor(x0, y0, x1, y1, base, grid, step){
  poly([project(x0,y0,0), project(x1,y0,0), project(x1,y1,0), project(x0,y1,0)], base);
  ctx.strokeStyle = grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.ceil(x0/step)*step; x <= x1; x += step){
    const a = project(x,y0,0), b = project(x,y1,0);
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  }
  for (let y = Math.ceil(y0/step)*step; y <= y1; y += step){
    const a = project(x0,y,0), b = project(x1,y,0);
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  }
  ctx.stroke();
}

function drawCrate(c, opts){
  opts = opts || {};
  const x = c.x, y = c.y, hw = c.hw, hd = c.hd, h = c.h;

  poly([project(x-hw,y-hd,0), project(x+hw,y-hd,0), project(x+hw,y+hd,0), project(x-hw,y+hd,0)],
       'rgba(0,0,0,0.32)');
  poly([project(x+hw,y-hd,0), project(x+hw,y+hd,0), project(x+hw,y+hd,h), project(x+hw,y-hd,h)],
       c.side1, 'rgba(0,0,0,0.28)', 1);
  poly([project(x-hw,y+hd,0), project(x+hw,y+hd,0), project(x+hw,y+hd,h), project(x-hw,y+hd,h)],
       c.side2, 'rgba(0,0,0,0.28)', 1);
  poly([project(x-hw,y-hd,h), project(x+hw,y-hd,h), project(x+hw,y+hd,h), project(x-hw,y+hd,h)],
       c.top, 'rgba(0,0,0,0.28)', 1);

  if (opts.highlight){
    ctx.save();
    ctx.globalAlpha = opts.highlight;
    ctx.shadowColor = opts.glow || '#7fe3ff';
    ctx.shadowBlur = 14;
    poly([project(x-hw,y-hd,h), project(x+hw,y-hd,h), project(x+hw,y+hd,h), project(x-hw,y+hd,h)],
         null, opts.glow || '#7fe3ff', 2.5);
    ctx.restore();
  }
}

function drawHumanoid(px, py, color, phase, opts){
  opts = opts || {};
  const z = cam.zoom;
  const base = project(px, py, 0);

  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(base.x, base.y, 13*z, 6.5*z, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  const bob = Math.sin(phase) * 1.6 * z;
  const hipY      = base.y - 18*z + bob;
  const shoulderY = base.y - 34*z + bob;
  const headR     = 7.5*z;
  const headY     = shoulderY - headR - 1*z;
  const swing     = Math.sin(phase) * 3.4*z;

  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = 5.5*z;
  ctx.beginPath(); ctx.moveTo(base.x - 3.6*z, hipY); ctx.lineTo(base.x - 3.6*z + swing, base.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(base.x + 3.6*z, hipY); ctx.lineTo(base.x + 3.6*z - swing, base.y); ctx.stroke();

  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(18,24,36,0.55)';
  ctx.lineWidth = 1.4*z;
  roundRect(base.x - 7*z, shoulderY, 14*z, (hipY - shoulderY) + 4*z, 4.5*z);
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = color;
  ctx.lineWidth = 4.6*z;
  ctx.beginPath(); ctx.moveTo(base.x - 7*z, shoulderY + 3.5*z); ctx.lineTo(base.x - 9.5*z - swing*0.6, hipY + 2*z); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(base.x + 7*z, shoulderY + 3.5*z); ctx.lineTo(base.x + 9.5*z + swing*0.6, hipY + 2*z); ctx.stroke();

  ctx.beginPath(); ctx.arc(base.x, headY, headR, 0, TAU);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = 'rgba(18,24,36,0.55)';
  ctx.lineWidth = 1.4*z;
  ctx.stroke();

  ctx.fillStyle = '#1b2230';
  ctx.beginPath(); ctx.arc(base.x - 2.7*z, headY - 0.6*z, 1.25*z, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(base.x + 2.7*z, headY - 0.6*z, 1.25*z, 0, TAU); ctx.fill();

  if (opts.gun){
    const hx = base.x + 9.5*z + swing*0.6;
    const hy = hipY + 2*z;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-0.38);
    ctx.fillStyle = '#2f4a63';
    ctx.fillRect(-1.6*z, 0, 3.4*z, 6.2*z);
    ctx.fillStyle = '#4f7da8';
    ctx.fillRect(-1.4*z, -6.2*z, 10*z, 3.6*z);
    ctx.fillStyle = '#5ac8ff';
    ctx.fillRect(0.6*z, -5.4*z, 3.8*z, 2.1*z);
    ctx.fillStyle = '#bfeaff';
    ctx.fillRect(8.4*z, -5.6*z, 2.6*z, 2.4*z);
    ctx.restore();

    if (opts.flash > 0){
      const a = -0.38;
      const mx = hx + Math.cos(a) * 12*z;
      const my = hy + Math.sin(a) * 12*z - 4*z;
      ctx.save();
      ctx.globalAlpha = clamp(opts.flash * 9, 0, 1);
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, 12*z);
      g.addColorStop(0, 'rgba(200,245,255,0.95)');
      g.addColorStop(1, 'rgba(90,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(mx, my, 12*z, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

function drawProjectile(p){
  const base = project(p.x, p.y, 0);
  const z = cam.zoom;
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(base.x, base.y, 5*z, 2.6*z, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  const sp = project(p.x, p.y, p.z);
  const g = ctx.createRadialGradient(sp.x - 1.5*z, sp.y - 1.5*z, 0.5*z, sp.x, sp.y, 7*z);
  g.addColorStop(0, '#f2ffff');
  g.addColorStop(0.45, '#7fdcff');
  g.addColorStop(1, '#2b8fd0');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sp.x, sp.y, 5.6*z, 0, TAU); ctx.fill();
}

function drawSplash(f){
  const t = clamp(f.t / f.max, 0, 1);
  const p = project(f.x, f.y, f.z);
  const z = cam.zoom;
  const seed = (f.x * 0.13 + f.y * 0.07) % TAU;
  ctx.save();
  ctx.globalAlpha = 1 - t;
  ctx.strokeStyle = '#7fe3ff';
  ctx.lineWidth = 2.4 * z;
  ctx.beginPath();
  ctx.arc(p.x, p.y, (7 + t * 30) * z, 0, TAU);
  ctx.stroke();

  ctx.fillStyle = '#bfeaff';
  for (let i = 0; i < 5; i++){
    const a = (i / 5) * TAU + seed;
    const r = (10 + t * 34) * z;
    ctx.beginPath();
    ctx.arc(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r * 0.6, 2.2 * z * (1 - t), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFloatLabel(sx, sy, text){
  ctx.save();
  ctx.font = '700 15px Segoe UI, system-ui, sans-serif';
  const w = ctx.measureText(text).width + 22;
  const h = 30;
  ctx.fillStyle = 'rgba(14,19,27,0.92)';
  ctx.strokeStyle = '#5ac8ff';
  ctx.lineWidth = 1.5;
  roundRect(sx - w/2, sy - h/2, w, h, 9);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#dff4ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, sx, sy + 1);
  ctx.restore();
}

/* =========================================================
   BACKGROUND (menu / list)
   ========================================================= */
let bgCrates = null;
function initBackground(){
  const rnd = (() => { let a = 777; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
  bgCrates = [];
  for (let i = 0; i < 30; i++){
    const x = (rnd() - 0.5) * 1500;
    const y = (rnd() - 0.5) * 1500;
    const hw = 18 + rnd()*14;
    const hd = 18 + rnd()*14;
    const h  = 28 + rnd()*44;
    const c  = BLOCK_COLORS[Math.floor(rnd()*BLOCK_COLORS.length)];
    bgCrates.push({ x, y, hw, hd, h, top:c.top, side1:c.side1, side2:c.side2 });
  }
}

function renderBackground(){
  const t = performance.now() / 1000;
  cam.x = Math.sin(t * 0.11) * 300;
  cam.y = Math.cos(t * 0.085) * 300;
  cam.zoom = 0.72;
  drawFloor(-950, -950, 950, 950, '#101722', 'rgba(255,255,255,0.035)', 50);
  const list = bgCrates.slice().sort((a,b) => (a.x+a.y) - (b.x+b.y));
  for (const c of list) drawCrate(c);
  const hx = Math.sin(t * 0.33) * 520;
  const hy = Math.cos(t * 0.26) * 520;
  drawHumanoid(hx, hy, '#eef2f9', t * 9);
}

/* =========================================================
   SETTINGS / DEBUG UI
   ========================================================= */
function openSettings(){
  const l = state.lobby;
  if (!l || !state.isHost) return;
  const s = l.settings;

  $('#selMap').value = s.mapMode;

  const sel = $('#selHunter');
  sel.innerHTML = '';
  sel.add(new Option('Случайно', 'random'));
  for (let i = 1; i <= s.playerCount; i++){
    const p = l.players[i-1];
    sel.add(new Option(`${i}. ${p ? p.name : 'слот'}${p && p.id === state.youId ? ' (вы)' : ''}`, 'slot' + i));
  }
  sel.value = s.hunter;

  $('#rngCount').value = s.playerCount;
  $('#lblCount').textContent = s.playerCount;
  $('#chkBots').checked = !!s.bots;
  $('#chkDebug').checked = !!s.debug;

  state.settingsOpen = true;
  $('#panelSettings').classList.remove('hidden');
}
function closeSettings(){
  state.settingsOpen = false;
  $('#panelSettings').classList.add('hidden');
}
function sendSettings(){
  if (!state.isHost || !state.lobby) return;
  send({
    type: 'updateSettings',
    settings: {
      mapMode: $('#selMap').value,
      hunter: $('#selHunter').value,
      playerCount: parseInt($('#rngCount').value, 10),
      bots: $('#chkBots').checked,
      debug: $('#chkDebug').checked,
    }
  });
}

function toggleDebug(){
  if (!state.debugEnabled || state.screen !== 'game') return;
  const p = $('#panelDebug');
  if (p.classList.contains('hidden')){
    updateDebugPanel();
    p.classList.remove('hidden');
  } else {
    p.classList.add('hidden');
  }
}
function closeDebug(){ $('#panelDebug').classList.add('hidden'); }
function updateDebugPanel(){
  const me = localEntity();
  if (!me) return;
  $('#btnSwitchRole').textContent = me.role === 'hunter' ? 'Стать прячущимся' : 'Стать охотником';
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastTime = performance.now();

function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.screen === 'lobby' && lobbyWorld){
    updateLobby(dt);
  } else if (state.screen === 'game' && state.game){
    updateGameClient(dt);
  }

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#121a26');
  g.addColorStop(1, '#070a10');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (state.screen === 'menu' || state.screen === 'list'){
    renderBackground();
  } else if (state.screen === 'lobby'){
    renderLobby();
  } else if (state.screen === 'game'){
    renderGame();
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   UI BINDINGS
   ========================================================= */
$('#inpName').addEventListener('input', e => {
  state.name = e.target.value || 'Игрок';
  send({ type: 'setName', name: state.name });
});

$('#btnPlay').onclick = () => {
  renderLobbyList();
  setScreen('list');
};
$('#btnBackMenu').onclick = () => setScreen('menu');
$('#btnCreateLobby').onclick = () => send({ type: 'createLobby' });
$('#btnLeaveLobby').onclick = () => send({ type: 'leaveLobby' });

$('#btnGameMenu').onclick = () => {
  send({ type: 'leaveGame' });
};

$('#selMap').onchange = sendSettings;
$('#selHunter').onchange = sendSettings;
$('#rngCount').oninput = e => {
  $('#lblCount').textContent = e.target.value;
  sendSettings();
};
$('#chkBots').onchange = sendSettings;
$('#chkDebug').onchange = sendSettings;
$('#btnStartGame').onclick = () => send({ type: 'startGame' });
$('#btnCloseSettings').onclick = () => closeSettings();

$('#btnSwitchRole').onclick = () => {
  const me = localEntity();
  if (!me) return;
  send({ type: 'debugSetRole', role: me.role === 'hunter' ? 'hider' : 'hunter' });
  setTimeout(updateDebugPanel, 100);
};
$('#btnExitToMenu').onclick = () => {
  closeDebug();
  send({ type: 'leaveGame' });
};
$('#btnCloseDebug').onclick = () => closeDebug();

/* при получении настроек от сервера запоминаем debug */
const origHandle = handleMessage;
handleMessage = function(msg){
  if (msg.type === 'lobbyUpdate' || msg.type === 'lobbyJoined'){
    if (msg.lobby && msg.lobby.settings) state.debugEnabled = !!msg.lobby.settings.debug;
  }
  origHandle(msg);
};

/* =========================================================
   BOOT
   ========================================================= */
initBackground();
setScreen('menu');
connect();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
